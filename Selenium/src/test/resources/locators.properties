# Định danh phần tử giao diện. Định dạng: css:<selector> | xpath:<biểu thức> | id:<id>
# [PO] = lấy từ page object của bộ end-to-end-tests trong repo (đã có sẵn).
# [DOAN] = suy đoán, cần xác nhận bằng "run_selenium.cmd locators" hoặc "run_selenium.cmd dump".

# ---- Thanh điều hướng
nav.brand=css:.navbar-brand
nav.report=id:reportLink
nav.branding=id:brandingLink
nav.notification=css:.badge
nav.frontPage=id:frontPageLink
# [DOAN]
admin.logout=xpath://*[self::a or self::button][normalize-space()='Logout']

# ---- Trang chủ
home.roomCards=css:.room-card
home.reserveLinks=css:.room-card a
home.alert=css:.alert-danger
# [DOAN] biểu mẫu liên hệ
contact.name=xpath://input[@id='name' or @name='name']
contact.email=xpath://input[@id='email' or @name='email']
contact.phone=xpath://input[@id='phone' or @name='phone']
contact.subject=xpath://input[@id='subject' or @name='subject']
contact.description=xpath://textarea[@id='description' or @name='description']
contact.submit=xpath://button[@id='submitContact' or normalize-space()='Submit']
contact.success=xpath://*[contains(translate(normalize-space(text()),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'thanks for getting in touch')]

# ---- Trang đặt phòng
reservation.open=id:doReservation
# nút gửi đặt phòng: chữ 'Reserve Now', không có id (nút mở biểu mẫu mới có id doReservation)
home.bookButton=xpath://button[normalize-space()='Reserve Now' and not(@id='doReservation')]
reservation.calendar=css:.rbc-calendar
# sự kiện đã đặt trên lịch (bỏ qua ô "Selected" là ngày đang chọn)
reservation.events=xpath://div[contains(@class,'rbc-event-content') and not(@title='Selected')]
reservation.nights=xpath://span[contains(normalize-space(),'nights')]
admin.roomEdit=xpath://button[normalize-space()='Edit']
# [DOAN] ô nhập và lịch (react-big-calendar)
booking.firstname=xpath://input[@id='firstname' or @name='firstname']
booking.lastname=xpath://input[@id='lastname' or @name='lastname']
booking.email=xpath://input[@id='email' or @name='email']
booking.phone=xpath://input[@id='phone' or @name='phone']
reservation.nextMonth=xpath://div[contains(@class,'rbc-toolbar')]//button[normalize-space()='Next']
reservation.weekRows=css:.rbc-month-row
booking.success=xpath://*[contains(normalize-space(text()),'Booking Confirmed')]

# ---- Khu quản trị
login.username=id:username
login.password=id:password
login.submit=id:doLogin
admin.roomHeader=css:div.col-sm-2.rowHeader
admin.roomName=id:roomName
admin.roomPrice=id:roomPrice
admin.roomCreate=id:createRoom
admin.roomRows=css:div[data-type~="room"]
admin.roomForm=css:.room-form
# [DOAN] nút cập nhật phòng
admin.roomUpdate=xpath://button[@id='update' or normalize-space()='Update']
admin.bookingItems=css:.detail
messages.delete=css:.roomDelete
report.calendar=css:.rbc-calendar
branding.name=id:name
# [DOAN] nút cập nhật thương hiệu
branding.update=xpath://button[@id='updateBranding' or normalize-space()='Submit' or normalize-space()='Update']
